server:
    port: ${PORT:8080}

spring:
    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: ${JPA_DDL_AUTO:update}
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect

jwt:
    signerKey: ${JWT_SIGNER_KEY}
    valid-duration: ${JWT_VALID_DURATION:36000}
    refreshable-duration: ${JWT_REFRESHABLE_DURATION:360000}

ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}

app:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}